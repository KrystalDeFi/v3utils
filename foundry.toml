[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
optimizer = true
optimizer_runs = 200
# See more config options https://github.com/foundry-rs/foundry/tree/master/config
solc = "0.8.15"

[profile.v3utilslinker]
src = 'src'
out = 'out'
libs = ['lib']
optimizer = true
optimizer_runs = 200
# See more config options https://github.com/foundry-rs/foundry/tree/master/config
solc = "0.8.15"

# Verify.s.sol reads the `libraries` list below to build `forge verify-contract --libraries`, so the
# deploy and the verification can never drift apart. fs_permissions is a forge runtime setting only -
# it is not part of the solc input, so it does not move any CREATE2 address.
fs_permissions = [{ access = "read", path = "./foundry.toml" }]

libraries = [
    'src/Nfpm.sol:Nfpm:0x7b468aFA6826Ea4fF6021456fE1485C4064Dea0a',
    'src/CommonLib.sol:CommonLib:0xc4aee87ba7a14601cd48294a6d6c92b1196d9bd4'
]

[profile.linker]
src = 'src'
out = 'out'
libs = ['lib']
optimizer = true
optimizer_runs = 200
# See more config options https://github.com/foundry-rs/foundry/tree/master/config
solc = "0.8.15"

# Verify.s.sol reads the `libraries` list below to build `forge verify-contract --libraries`, so the
# deploy and the verification can never drift apart. fs_permissions is a forge runtime setting only -
# it is not part of the solc input, so it does not move any CREATE2 address.
fs_permissions = [{ access = "read", path = "./foundry.toml" }]

libraries = [
    'src/StructHash.sol:StructHash:0x7637F99dF82CA0f47d8e3D6742c925b7B14900A5',
    'src/Nfpm.sol:Nfpm:0x7b468aFA6826Ea4fF6021456fE1485C4064Dea0a',
    'src/CommonLib.sol:CommonLib:0xc4aee87ba7a14601cd48294a6d6c92b1196d9bd4'
]

# NOTE: compute these addresses under the SAME profile the deploy script runs in, or you will get a
# different answer. bytecode_hash defaults to "ipfs" and the appended metadata covers the compiler
# settings -- including `libraries` -- so a build that links libraries produces different bytecode,
# and therefore a different CREATE2 address, than one that does not. `make deploy-commonlib` sets no
# FOUNDRY_PROFILE, so CommonLib is deployed (and must be computed) under [profile.default].
# The same metadata sensitivity means an unrelated dependency change moves every address here: PR #60
# shifted all of them just by adding two lines to remappings.txt. After any dependency or settings
# change, recompute and re-pin, and confirm against the deploy broadcast rather than trusting a
# local computation.
#
# These files are compiled to CREATE2-deployed libraries at the hardcoded
# addresses above. Their deployed address depends on keccak256(creationCode),
# and with bytecode_hash = "ipfs" (the default) the appended metadata hash
# embeds a hash of the source bytes -- so ANY reformat changes the bytecode and
# therefore the CREATE2 address. Keep them out of `forge fmt` to pin the source.
[fmt]
ignore = ["src/StructHash.sol", "src/Nfpm.sol", "src/CommonLib.sol"]
